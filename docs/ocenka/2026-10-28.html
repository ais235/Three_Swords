<body>
<title>Готовность «Три клинка / Three Blades»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Лист техосмотра: вердикт и узкое место сверху, карта 40 клеток, приоритеты, разбор по блокам. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #17212a; --muted: #586674; --line: #d5dce2; --accent: #0f6b70;
  --s-none: #e3e8ec; --s0: #c63f2c; --s1: #d9822b; --s2: #c5a020; --s3: #4f9a47; --s4: #1d7558;
  --on-score: #ffffff; --on-pale: #17212a;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --surface: #1a2128; --ink: #e4e9ee; --muted: #93a1ae; --line: #2c3640; --accent: #4fb3b8;
  --s-none: #26303a; --s0: #d8573f; --s1: #e0923e; --s2: #cdae3a; --s3: #5fae56; --s4: #2f9873;
  --on-score: #0f1418; --on-pale: #e4e9ee; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1a2128; --ink: #e4e9ee; --muted: #93a1ae; --line: #2c3640; --accent: #4fb3b8;
  --s-none: #26303a; --s0: #d8573f; --s1: #e0923e; --s2: #cdae3a; --s3: #5fae56; --s4: #2f9873;
  --on-score: #0f1418; --on-pale: #e4e9ee; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 600 13px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* шапка */
.head { display: grid; gap: 6px; }
.eyebrow { font: 600 12px/1.2 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.head h1 { font: 700 clamp(30px, 5vw, 48px)/1.05 var(--f-display); letter-spacing: -.01em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; }
.meta b { color: var(--ink); font-weight: 500; }
.summary { max-width: 68ch; font-size: 17px; margin: 6px 0 0; }

/* вердикт */
.verdict { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.big { display: flex; align-items: baseline; gap: 10px; }
.big .num { font: 700 64px/1 var(--f-display); }
.big .of { font: 500 20px/1 var(--f-data); color: var(--muted); }
.ruler { position: relative; margin: 18px 0 6px; height: 12px; border-radius: 6px;
  background: linear-gradient(90deg, var(--s0) 0 30%, var(--s1) 30% 50%, var(--s2) 50% 70%, var(--s3) 70% 90%, var(--s4) 90%); }
.ruler .mark { position: absolute; top: -6px; width: 4px; height: 24px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.ticks { display: flex; justify-content: space-between; font: 11px/1 var(--f-data); color: var(--muted); }
.neck { margin-top: 14px; font-size: 15px; }
.neck b { font-weight: 600; }
.side { display: grid; gap: 14px; align-content: start; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.kv .v { font: 700 28px/1 var(--f-display); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* карта 40 клеток */
.map { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: 170px minmax(0, 1fr) 44px; gap: 12px; align-items: center; }
.mrow .bn { font-weight: 600; font-size: 14px; }
.mrow .bavg { font: 600 15px/1 var(--f-data); text-align: right; }
.cells { display: flex; flex-wrap: wrap; gap: 5px; }
.cell { width: 36px; height: 36px; border-radius: 6px; border: 0; display: grid; place-items: center;
  font: 600 13px/1 var(--f-data); color: var(--on-score); cursor: pointer; position: relative; text-decoration: none; }
.cell.crit::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--on-score); }
.cell.pale { color: var(--on-pale); }

/* приоритеты */
.prio { display: grid; gap: 10px; counter-reset: p; margin: 0; padding: 0; list-style: none; }
.prio li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.prio li::before { counter-increment: p; content: counter(p); font: 700 20px/1.1 var(--f-display); color: var(--accent); }
.prio .t { font-weight: 600; }
.prio .g { font: 13px/1.4 var(--f-data); color: var(--muted); text-align: right; max-width: 30ch; }

/* фильтр */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font: 500 14px/1 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 14px; cursor: pointer; min-height: 38px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* разбор */
.block { display: grid; gap: 10px; }
.block > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 6px; }
.block h3 { font: 600 20px/1.2 var(--f-display); }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; scroll-margin-top: 16px; }
.item:target { outline: 2px solid var(--accent); }
.score { width: 56px; height: 56px; border-radius: 8px; display: grid; place-items: center; font: 700 22px/1 var(--f-display); color: var(--on-score); }
.score.pale { color: var(--on-pale); }
.ititle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.ititle h4 { margin: 0; font-size: 17px; font-weight: 600; }
.chip { font: 600 11px/1 var(--f-data); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 4px;
  border: 1px solid var(--line); color: var(--muted); }
.chip.crit { border-color: var(--ink); color: var(--ink); }
.chip.warn { border-color: var(--s1); color: var(--s1); }
.chip.up { border-color: var(--s3); color: var(--s3); }
.chip.down { border-color: var(--s0); color: var(--s0); }
.what { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
.rows { display: grid; gap: 6px; margin: 0; }
.rows div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; }
.rows dt { font: 600 12px/1.6 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; overflow-wrap: anywhere; }
.bar { display: flex; gap: 3px; margin-top: 10px; }
.bar span { flex: 1; height: 5px; border-radius: 2px; background: var(--s-none); }
.foot { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 760px) {
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .mrow { grid-template-columns: minmax(0, 1fr) 44px; }
  .mrow .cells { grid-column: 1 / -1; grid-row: 2; }
  .item { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
  .score { width: 44px; height: 44px; font-size: 18px; }
  .rows div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .prio li { grid-template-columns: 26px minmax(0, 1fr); }
  .prio .g { grid-column: 2; text-align: left; white-space: normal; }
  .big .num { font-size: 52px; }
}
@media (prefers-reduced-motion: no-preference) { .cell { transition: transform .12s; } .cell:hover { transform: translateY(-2px); } }
</style>

и, доля выбора каждого (аналитика), листы персонажей.","na":"В игре нет управляемого персонажа (головоломка, карточная без героя)."},{"id":"enemies","block":"content","name":"Враги","critical":false,"what":"Разнообразие противников, их поведение и роль.","questions":["Сколько видов и сколько разных поведений?","Требует ли каждый вид своей тактики?","Хватает ли видов на длину игры?"],"evidence":"Бестиарий с числом видов и поведений, пулы врагов по зонам.","na":"В игре нет противников."},{"id":"bosses","block":"content","name":"Боссы","critical":false,"what":"Ключевые бои: фазы, приёмы, запоминаемость.","questions":["У каждого босса свой приём, которому надо научиться?","Есть ли фазы и предупреждения перед сильными атаками?","Победа ощущается событием?"],"evidence":"Список боссов с фазами, процент побед бота или игроков с первой попытки.","na":"Жанр без боссов."},{"id":"npc","block":"content","name":"НПС","critical":false,"what":"Жители мира: торговцы, квестодатели, спутники.","questions":["У каждого НПС есть функция в игре?","Узнаются ли они внешне и по речи?","Меняются ли они по ходу сюжета?"],"evidence":"Список НПС с функциями, реплики, портреты.","na":"В игре нет персонажей, кроме игрока."},{"id":"world","block":"content","name":"Мир и уровни","critical":false,"what":"Карта, размеры, зоны, концепция пространства.","questions":["Сколько зон и чем они различаются?","Хватает ли пространства на заявленную длину игры?","Видно ли, куда идти, без стрелки?"],"evidence":"Атлас зон с размерами, время прохождения зоны (замер), план сверху."},{"id":"map_objects","block":"content","name":"Предметы на карте","critical":false,"what":"Сундуки, тайники, ловушки, интерактив в мире.","questions":["Есть ли ради чего сходить с основного пути?","Отличаются ли интерактивные предметы от декора?","Нет ли пустых зон?"],"evidence":"Список видов интерактива, плотность на зону.","na":"Игра без пространства (меню, карты, доска)."},{"id":"loot","block":"content","name":"Оружие и лут","critical":false,"what":"Добыча, предметы, их разнообразие и ценность.","questions":["Хочется ли подбирать и сравнивать?","Хватает ли тиров на всю игру?","Есть ли редкие находки, которыми гордятся?"],"evidence":"Число баз, аффиксов, уникальных; кривая уровня предметов по игре.","na":"Жанр без добычи."},{"id":"progression","block":"content","name":"Прокачка","critical":false,"what":"Уровни, характеристики, дерево умений, рост силы.","questions":["Есть ли выбор, который меняет стиль игры?","Ощущается ли рост силы?","Не кончается ли прокачка раньше игры?"],"evidence":"Дерево умений, кривая силы по уровням, уровень героя на этапах (прогон бота).","na":"Игра без развития персонажа."},{"id":"economy","block":"content","name":"Экономика","critical":false,"what":"Валюты, цены, на что игрок копит и тратит.","questions":["Есть ли на что тратить на каждом этапе?","Не копятся ли деньги без смысла?","Нет ли тупика «не на что купить нужное»?"],"evidence":"Таблица доходов и цен по этапам, баланс кошелька у бота.","na":"В игре нет ресурсов и обмена."},{"id":"quests","block":"content","name":"Сюжет, квесты, диалоги","critical":false,"what":"Что игрок делает в мире и зачем; тексты.","questions":["Понятно ли, зачем идти дальше?","Цели читаются без перечитывания журнала?","Тексты короткие и в одном голосе?"],"evidence":"Список заданий, длина реплик, процент игроков, понявших цель (плейтест).","na":"Игра без сюжета и заданий."},{"id":"lore","block":"content","name":"Лор","critical":false,"what":"История и устройство мира.","questions":["Мир последователен?","Лор поддерживает механики, а не просто висит текстом?","Есть ли что открывать любопытному игроку?"],"evidence":"Документ лора, где он проявляется в игре (имена, предметы, места).","na":"Абстрактная игра без мира."},{"id":"extra","block":"content","name":"Особые механики","critical":false,"what":"Фирменные системы сверх ядра (горн, крафт, питомцы и т.п.).","questions":["Механика добавляет решение, а не клик?","Встроена ли она в петлю?","Понятн го носителем — 8 → 9."},"tests":{"score":7,"critical":false,"people":false,"evidence":"13 наборов, 557 проверок, последний прогон 28.10 зелёный; у части проверок доказано падение на старом коде (иконки, перевод)","why":"Покрытие широкое и проверки ловят настоящие дефекты. Но пороги не вынесены наружу, и строгим значением прогон не гоняли.","advice":"Переопределяемые пороги (MIN_TAP, MIN_FONT) и прогон со строгими значениями — 7 → 8."},"platform":{"score":7,"critical":false,"people":false,"evidence":"npm run package:itch собирает архив одной командой; npm run test:itch проверяет сборку; для Яндекса отдельная сборка с 0 FAIL чекера","why":"Площадка выбрана, сборка одной командой, требования проверяются автоматически. Страница на itch ещё не создана.","advice":"Создать страницу и прогнать по списку docs/ITCH_PAGE.md — 7 → 8."},"monetization":{"score":null,"na":"Бесплатная игра на itch без рекламы и покупок по замыслу; рекламный код остался только в сборке для Яндекса."},"analytics":{"score":1,"critical":false,"people":false,"evidence":"поиск по исходникам: ни счётчика, ни событий; доступна только статистика просмотров itch","why":"Где игроки бросают — узнать неоткуда. После выкладки это главный источник правды.","advice":"Пять событий в localStorage и отправка в бесплатный счётчик: запуск, конец обучения, конец первого боя, смерть, финал — 1 → 5."},"storefront":{"score":6,"critical":false,"people":false,"evidence":"artifacts/store/cover-630x500.png, banner-960x350.png, 5 скриншотов и ролик в artifacts/promo/, текст в docs/ITCH_PAGE.md; название «ТРИ КЛИНКА» стоит в главном меню игры","why":"Комплект материалов собран и описание продаёт игру за две строки. Но название живёт в интерфейсе — против собственного правила проекта: переименование потянет за собой скриншоты и ролик.","advice":"Убрать название из меню, проверить занятость имени на itch, переснять кадры — 6 → 8."},"legal":{"score":5,"critical":false,"people":false,"evidence":"assets/ui/kit/README.md с текстом CC 8; без этого публикация — риск, который не виден до претензии"},{"id":"storefront","action":"Убрать название игры из главного меню и показать номер версии в настройках","cost":"1–2 часа","gain":"storefront 6 → 7, support 2 → 4"},{"id":"playtests","action":"Дать игру трём-пяти незнакомым людям, записать первые десять минут, разобрать по механизму","cost":"неделя календарно","gain":"playtests 0 → 5 и снимает потолок «не проверено людьми» со всех критичных пунктов"},{"id":"analytics","action":"Пять событий: запуск, конец обучения, первый бой, смерть, финал","cost":"полдня","gain":"analytics 1 → 5; после выкладки это единственный способ узнать, где бросают"}]}</script>
<script>
(function () {
  const spec = JSON.parse(document.getElementById('spec').textContent);
  const d = JSON.parse(document.getElementById('data').textContent);
  const items = d.items || {};
  const prev = (d.previous && d.previous.scores) || {};
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tone = (s) => s == null ? 'var(--s-none)' : s <= 2 ? 'var(--s0)' : s <= 4 ? 'var(--s1)' : s <= 6 ? 'var(--s2)' : s <= 8 ? 'var(--s3)' : 'var(--s4)';
  const fmt = (x) => x == null ? '—' : (Math.round(x * 10) / 10).toString().replace('.', ',');

  // пункт = описание из списка + оценка
  const rows = spec.items.map((it) => {
    const a = items[it.id];
    const r = { ...it, a, rated: !!a, na: a && a.score == null, score: a ? a.score : null };
    r.crit = a && typeof a.critical === 'boolean' ? a.critical : it.critical;
    r.warn = [];
    if (a && a.score != null) {
      if (a.score > 4 && !String(a.evidence || '').trim()) r.warn.push('нет доказательства — потолок 4');
      if (a.score >= 8 && !a.people) r.warn.push('8+ без живых игроков');
    }
    r.delta = (a && a.score != null && prev[it.id] != null) ? a.score - prev[it.id] : null;
    return r;
  });
  const scored = rows.filter((r) => r.score != null);
  const crit = scored.filter((r) => r.crit);
  const rest = scored.filter((r) => !r.crit);
  const mean = (xs) => xs.length ? xs.reduce((s, r) => s + r.score, 0) / xs.length : null;
  const readiness = crit.length ? Math.min(...crit.map((r) => r.score)) : null;
  const necks = crit.filter((r) => r.score === readiness);
  const fullness = mean(rest);
  const unrated = rows.filter((r) => !r.rated);
  const critUnrated = unrated.filter((r) => r.crit);

  const app = document.getElementById('app');
  const meta = [['Сборка', d.build], ['Дата', d.date], ['Жанр', d.genre], ['Площадка', d.platform], ['Этап', d.stage]]
    .filter(([, v]) => v).map(([k, v]) => `<span>${k}: <b>${esc(v)}</b></span>`).join('');

  const markPos = readiness == null ? 0 : readiness * 10;
  const neckText = readiness == null ? 'Критичные пункты не оценены.'
    : `Упирается в: ${necks.map((r) => `<a href="#${r.id}"><b>${esc(r.name)}</b></a>`).join(', ')}` +
      (critUnrated.length ? `. Не оценены критичные: ${critUnrated.map((r) => esc(r.name)).join(', ')}.` : '.');
  const blocks = spec.blocks.map((b) => {
    const rs = rows.filter((r) => r.block === b.id);
    return { ...b, rs, avg: mean(rs.filter((r) => r.score != null)) };
  });

  const cell = (r) => {
    const pale = r.score == null;
    const label = r.na ? '—' : r.score == null ? '?' : r.score;
    const tip = `${r.name}: ${r.na ? 'неприменимо' : r.score == null ? 'не оценено' : r.score + ' из 10'}${r.crit ? ', критичный' : ''}`;
    return `<a class="cell${r.crit ? ' crit' : ''}${pale ? ' pale' : ''}" href="#${r.id}" style="background:${tone(r.score)}" title="${esc(tip)}" aria-label="${esc(tip)}">${label}</a>`;
  };

  const prioHtml = (d.priorities || []).map((p) => {
    const r = rows.find((x) => x.id === p.id);
    return `<li><div><div class="t">${esc(p.action)}</div><div class="muted">${r ? `<a href="#${r.id}">${esc(r.name)}</a>` : ''}${p.why ? ' — ' + esc(p.why) : ''}</div></div>
      <div class="g">${p.gain ? esc(p.gain) : ''}${p.cost ? '<br>' + esc(p.cost) : ''}</div></li>`;
  }).join('');

  const itemHtml = (r) => {
    const a = r.a || {};
    const chips = [];
    if (r.crit) chips.push('<span class="chip crit">критичный</span>');
    if (r.na) chips.push('<span class="chip">неприменимо</span>');
    if (!r.rated) chips.push('<span class="chip warn">не оценено</span>');
    if (a.people) chips.push('<span class="chip up">проверено игроками</span>');
    if (r.delta) chips.push(`<span class="chip ${r.delta > 0 ? 'up' : 'down'}">${r.delta > 0 ? '▲ +' : '▼ '}${r.delta} к прошлой</span>`);
    for (const w of r.warn) chips.push(`<span class="chip warn">${esc(w)}</span>`);
    const dl = r.na ? [['Почему «—»', a.na]] : [['Доказано', a.evidence], ['Почему', a.why], ['Совет', a.advice]];
    const bar = Array.from({ length: 10 }, (_, i) => `<span style="${r.score != null && i < r.score ? 'background:' + tone(r.score) : ''}"></span>`).join('');
    return `<article class="item" id="${r.id}" data-crit="${r.crit ? 1 : 0}" data-low="${r.score != null && r.score < 5 ? 1 : 0}" data-unrated="${r.rated ? 0 : 1}">
      <div class="score${r.score == null ? ' pale' : ''}" style="background:${tone(r.score)}">${r.na ? '—' : r.score ?? '?'}</div>
      <div style="min-width:0">
        <div class="ititle"><h4>${esc(r.name)}</h4>${chips.join('')}</div>
        <p class="what">${esc(r.what)}</p>
        ${r.rated ? `<dl class="rows">${dl.filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`
          : `<p class="muted" style="margin:0">Вопросы: ${esc(r.questions.join(' '))}</p>`}
        ${r.na || !r.rated ? '' : `<div class="bar" aria-hidden="true">${bar}</div>`}
      </div></article>`;
  };

  app.innerHTML = `
    <header class="head">
      <div class="eyebrow">Готовность игры</div>
      <h1>${esc(d.game)}</h1>
      <div class="meta">${meta}</div>
      ${d.summary ? `<p class="summary">${esc(d.summary)}</p>` : ''}
    </header>

    <section class="verdict" aria-label="Итог">
      <div class="panel">
        <h2>Готовность — самый слабый критичный пункт</h2>
        <div class="big" style="margin-top:12px"><span class="num mono">${fmt(readiness)}</span><span class="of">из 10</span></div>
        <div class="ruler" role="img" aria-label="Готовность ${fmt(readiness)} из 10"><div class="mark" style="left:${markPos}%"></div></div>
        <div class="ticks" aria-hidden="true">${Array.from({ length: 11 }, (_, i) => `<span>${i}</span>`).join('')}</div>
        <p class="neck">${neckText}</p>
      </div>
      <div class="panel side">
        <div class="kv"><h2>Насыщенность</h2><span class="v mono">${fmt(fullness)}</span></div>
        <p class="muted" style="margin:0;font-size:14px">Среднее по некритичным пунктам: сколько в игре всего сверх обязательного.</p>
        <div class="kv"><span class="muted">Оценено</span><span class="mono">${scored.length + rows.filter((r) => r.na).length} из ${rows.length}</span></div>
        ${d.previous && d.previous.date ? `<div class="kv"><span class="muted">Прошлая оценка</span><span class="mono">${esc(d.previous.date)}</span></div>` : ''}
        <div class="legend"><span><i style="background:var(--s0)"></i>0–2</span><span><i style="background:var(--s1)"></i>3–4</span><span><i style="background:var(--s2)"></i>5–6</span><span><i style="background:var(--s3)"></i>7–8</span><span><i style="background:var(--s4)"></i>9–10</span><span>● критичный</span></div>
      </div>
    </section>

    <section class="map" aria-label="Карта пунктов">
      <h2>Карта: ${rows.length} направлений</h2>
      ${blocks.map((b) => `<div class="mrow"><div class="bn">${esc(b.name)}</div><div class="cells">${b.rs.map(cell).join('')}</div><div class="bavg">${fmt(b.avg)}</div></div>`).join('')}
    </section>

    ${prioHtml ? `<section style="display:grid;gap:12px"><h2>Что делать в первую очередь</h2><ol class="prio">${prioHtml}</ol></section>` : ''}

    <section style="display:grid;gap:16px" aria-label="Разбор">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
        <h2>Разбор по пунктам</h2>
        <div class="filters" role="group" aria-label="Показать">
          <button type="button" id="f-all" data-f="all" aria-pressed="true">Все</button>
          <button type="button" id="f-crit" data-f="crit" aria-pressed="false">Критичные</button>
          <button type="button" id="f-low" data-f="low" aria-pressed="false">Ниже 5</button>
          <button type="button" id="f-unrated" data-f="unrated" aria-pressed="false">Не оценено</button>
        </div>
      </div>
      ${blocks.map((b) => `<section class="block" data-block="${b.id}"><header><h3>${esc(b.name)}</h3><span class="muted">${esc(b.about)} · <span class="mono">${fmt(b.avg)}</span></span></header>${b.rs.map(itemHtml).join('')}</section>`).join('')}
    </section>

    <footer class="foot">Шкала: 0 нет · 1–2 заглушка · 3–4 начерно · 5–6 есть, слабее аналогов · 7 не стыдно показать · 8 проверено игроками · 9 сильная сторона · 10 лучшие в жанре.
      Без доказательства — не выше 4; 8 и выше — только после живых игроков. ${d.assessor ? 'Оценивал: ' + esc(d.assessor) + '.' : ''}</footer>`;

  const btns = app.querySelectorAll('.filters button');
  const apply = (f) => {
    btns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
    app.querySelectorAll('.item').forEach((el) => { el.hidden = f !== 'all' && el.dataset[f] !== '1'; });
    app.querySelectorAll('.block').forEach((s) => { s.hidden = ![...s.querySelectorAll('.item')].some((el) => !el.hidden); });
    try { localStorage.setItem('gr-filter', f); } catch (e) { /* хранилище недоступно */ }
  };
  btns.forEach((b) => b.addEventListener('click', () => apply(b.dataset.f)));
  let saved = 'all';
  try { saved = localStorage.getItem('gr-filter') || 'all'; } catch (e) { /* хранилище недоступно */ }
  if (location.hash) saved = 'all';
  apply(saved);
})();
</script>

</body>
</html>
